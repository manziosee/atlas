apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: atlas
labels:
  - pairs:
      app.kubernetes.io/name: atlas
      app.kubernetes.io/part-of: atlas
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - services.yaml
  - statefulset.yaml
  - pdb.yaml
  - networkpolicy.yaml
