# Headless service: stable DNS for gossip seeding. publishNotReadyAddresses
# lets nodes find each other before they report ready (no bootstrap deadlock).
apiVersion: v1
kind: Service
metadata:
  name: atlas-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: atlas
  ports:
    - name: gossip
      port: 7946
      targetPort: gossip
      protocol: UDP
    - name: gossip-stream
      port: 7946
      targetPort: gossip-stream
      protocol: TCP
---
# API service: load-balanced across ready pods.
apiVersion: v1
kind: Service
metadata:
  name: atlas
spec:
  selector:
    app.kubernetes.io/name: atlas
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 8082
      targetPort: grpc
      protocol: TCP
    - name: dns-udp
      port: 5353
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 5353
      targetPort: dns-tcp
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
