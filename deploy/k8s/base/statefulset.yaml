apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: atlas
spec:
  serviceName: atlas-headless
  replicas: 3
  # Gossip needs no ordered startup; Parallel speeds up scale-out/recovery.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas
        app.kubernetes.io/part-of: atlas
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: atlas
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: atlas }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: atlas }
      containers:
        - name: atlas
          image: ghcr.io/manziosee/atlas:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: gossip, containerPort: 7946, protocol: UDP }
            - { name: http, containerPort: 8080, protocol: TCP }
            - { name: metrics, containerPort: 9090, protocol: TCP }
          env:
            - name: ATLAS_NODE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            # IPv4 clusters; for IPv6 use "[$(POD_IP)]:7946".
            - name: ATLAS_GOSSIP_ADVERTISE_ADDR
              value: "$(POD_IP):7946"
            - name: ATLAS_ADDR # used by `atlas-cli` inside the pod
              value: http://127.0.0.1:8080
          envFrom:
            - configMapRef: { name: atlas-config }
            - secretRef: { name: atlas-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
