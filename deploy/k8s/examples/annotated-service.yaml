# A sample app registered in Atlas by the atlas-k8s controller: two pods
# behind an annotated Service. Requires the Helm chart with
# k8sSync.enabled=true (or atlas-k8s running elsewhere).
#
#   kubectl apply -f deploy/k8s/examples/annotated-service.yaml
#   kubectl -n demo scale deploy/whoami --replicas=3   # watch instances follow
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: whoami }
  template:
    metadata:
      labels: { app: whoami }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.1
          args: ["--port", "8080"]
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: demo
  annotations:
    atlas.io/register: "true"
    atlas.io/health: /health
    atlas.io/tags: demo,example
spec:
  selector: { app: whoami }
  ports:
    - { name: http, port: 80, targetPort: http }
