global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: atlas-local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: atlas
    static_configs:
      - targets: ["atlas-1:9090", "atlas-2:9090", "atlas-3:9090"]
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: node

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
