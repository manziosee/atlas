{{- if not .Values.secrets.existingSecret }}
{{- $name := include "atlas.secretName" . }}
{{- /* Reuse values from an earlier install so upgrades keep the same secrets. */}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := (get $existing "data") | default dict }}
{{- $gossip := .Values.secrets.gossipKey | default ((get $data "ATLAS_GOSSIP_KEY") | default "" | b64dec) | default (randAscii 32 | b64enc) }}
{{- $token := .Values.secrets.apiToken | default ((get $data "ATLAS_ADMIN_TOKEN") | default "" | b64dec) | default (randAlphaNum 48) }}
{{- $sync := (get $data "ATLAS_SYNC_TOKEN") | default "" | b64dec | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "atlas.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ATLAS_GOSSIP_KEY: {{ $gossip | quote }}
  ATLAS_ADMIN_TOKEN: {{ $token | quote }}
  ATLAS_SYNC_TOKEN: {{ $sync | quote }}
  ATLAS_API_TOKENS: {{ printf "%s,%s" $token $sync | quote }}
{{- end }}
