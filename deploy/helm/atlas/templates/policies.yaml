{{- if .Values.podDisruptionBudget.enabled }}
# Never voluntarily evict more than one member at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "atlas.fullname" . }}
  labels: {{- include "atlas.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels: {{- include "atlas.selector" . | nindent 6 }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "atlas.fullname" . }}
  labels: {{- include "atlas.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "atlas.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # Gossip only from other members.
    - from:
        - podSelector:
            matchLabels: {{- include "atlas.selector" . | nindent 14 }}
      ports:
        - { protocol: UDP, port: 7946 }
        - { protocol: TCP, port: 7946 }
    # API and DNS from this namespace and namespaces that opt in.
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.apiAccessLabel | nindent 14 }}
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8082 }
        - { protocol: UDP, port: 5353 }
        - { protocol: TCP, port: 5353 }
    # Metrics from the monitoring namespace.
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { protocol: TCP, port: 9090 }
{{- end }}
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "atlas.fullname" . }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels: {{- include "atlas.selector" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
