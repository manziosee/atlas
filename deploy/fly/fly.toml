# Fly.io multi-region deployment.
#
#   fly apps create atlas-edge
#   fly secrets set ATLAS_GOSSIP_KEY="$(atlas-cli keygen)" ATLAS_API_TOKENS="$(atlas-cli tokengen)" -a atlas-edge
#   fly deploy --config deploy/fly/fly.toml --dockerfile Dockerfile
#   fly scale count 4 --region jnb,fra,sin,iad -a atlas-edge
#
# Gossip runs over Fly's private WireGuard mesh (6PN, IPv6). Each Machine
# advertises FLY_PRIVATE_IP, and "<app>.internal" DNS returns every Machine,
# which makes it a zero-config seed list. Gossip is never exposed publicly.

app = "atlas-edge"
primary_region = "jnb"
kill_signal = "SIGTERM"
kill_timeout = "20s"

[build]
  [build.args]
    VERSION = "fly"

[env]
  ATLAS_ENV = "production"
  # Fly's edge terminates public TLS; traffic inside 6PN is WireGuard-encrypted.
  ATLAS_TLS_TERMINATED_UPSTREAM = "true"
  ATLAS_LOG_FORMAT = "json"
  ATLAS_GOSSIP_BIND_ADDR = "[::]:7946"
  ATLAS_SEEDS = "atlas-edge.internal:7946"
  ATLAS_HTTP_ADDR = "[::]:8080"
  ATLAS_METRICS_ADDR = "[::]:9090"
  # Cross-continent RTTs are 150-300ms: give probes more room than on a LAN.
  ATLAS_PROBE_INTERVAL = "2s"
  ATLAS_PROBE_TIMEOUT = "1s"
  ATLAS_SUSPICION_TIMEOUT = "10s"
  ATLAS_GOSSIP_INTERVAL = "300ms"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "2s"

[metrics]
  port = 9090
  path = "/metrics"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
