version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gosec        # security issues
    - bodyclose
    - errorlint
    - noctx
    - nilerr
    - misspell
    - unconvert
    - gocritic
    - revive
    - copyloopvar
    - durationcheck
    - contextcheck
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors: errcheck covers this
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    presets: [std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
      # Peer selection and probe sequence numbers only need statistical
      # randomness; packets are authenticated by AES-GCM, not by
      # unpredictable sequence numbers.
      - path: internal/membership/
        linters: [gosec]
        text: G404
      # The CLI's whole purpose is to call the operator-supplied --addr.
      - path: cmd/atlas-cli/
        linters: [gosec]
        text: G704

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/manziosee/atlas]
