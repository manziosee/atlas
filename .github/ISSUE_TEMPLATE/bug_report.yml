name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "⚠️ Security issues: do **not** file here — see SECURITY.md."
  - type: textarea
    id: what
    attributes: { label: What happened?, description: Include logs (redact secrets). }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What did you expect? }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: "Version (`atlas-cli version`)" }
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options: [docker compose, Kubernetes, Fly.io, bare metal, other]
