# Publishes the client libraries when a version tag (vX.Y.Z) is pushed, at
# the tag's version. Each registry is enabled separately by a repository
# variable, so a registry whose account isn't set up yet is skipped rather
# than failing the release. See RELEASING.md for the one-time setup.
#
#   PUBLISH_PYPI=true    Python  -> PyPI (trusted publishing, no secret)
#   PUBLISH_NPM=true     Node.js -> npm  (NPM_TOKEN)
#   PUBLISH_NUGET=true   C#      -> NuGet (NUGET_API_KEY)
#   PUBLISH_MAVEN=true   Java    -> Maven Central (MAVEN_CENTRAL_USERNAME,
#                        MAVEN_CENTRAL_PASSWORD, MAVEN_GPG_PRIVATE_KEY,
#                        MAVEN_GPG_PASSPHRASE)
name: Publish clients

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, such as v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: publish-clients-${{ github.event.inputs.tag || github.ref_name }}

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  pypi:
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ env.TAG }}", persist-credentials: false }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Build
        working-directory: clients/python
        run: |
          version="${TAG#v}"
          sed -i "s/^version = \".*\"/version = \"$version\"/" pyproject.toml
          python -m pip install --upgrade build
          python -m build
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist

  npm:
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ env.TAG }}", persist-credentials: false }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Build and publish
        working-directory: clients/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci --no-audit --no-fund
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          npm run build
          npm publish --provenance --access public

  nuget:
    if: vars.PUBLISH_NUGET == 'true'
    runs-on: ubuntu-latest
    environment: nuget
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ env.TAG }}", persist-credentials: false }
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 8.0.x }
      - name: Pack
        working-directory: clients/csharp
        run: |
          version="${TAG#v}"
          dotnet pack src/Atlas.Client -c Release -o out -p:Version="$version"
          dotnet pack src/Atlas.Client.DependencyInjection -c Release -o out -p:Version="$version"
          ls -l out
      - name: Publish
        working-directory: clients/csharp
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "out/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  maven:
    if: vars.PUBLISH_MAVEN == 'true'
    runs-on: ubuntu-latest
    environment: maven
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ env.TAG }}", persist-credentials: false }
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Deploy to Maven Central
        working-directory: clients/java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mvn -B -ntp versions:set -DnewVersion="${TAG#v}" -DgenerateBackupPoms=false
          mvn -B -ntp -P release -DskipTests deploy
