name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs opt in to more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@v9
        # Must be built with a Go release >= the go directive in go.mod.
        with: { version: v2.15.0 }

  test:
    name: Test (race + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go mod verify
      - run: go test -race -shuffle=on -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Enforce 60% statement coverage
        # Generated protobuf code is excluded; it is tested through the API.
        run: |
          grep -v '\.pb\.go:' coverage.out > coverage.handwritten.out
          total=$(go tool cover -func=coverage.handwritten.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          awk -v total="$total" 'BEGIN { if (total < 60) exit 1 }'
          echo "Total statement coverage: ${total}% (minimum 60%)"
      - uses: actions/upload-artifact@v7
        with: { name: coverage, path: coverage.out }

  python-client:
    name: Python client against a live node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: Start a single development node
        run: |
          go build -o "$RUNNER_TEMP/atlas-node" ./cmd/atlas-node
          go build -o "$RUNNER_TEMP/atlas-cli" ./cmd/atlas-cli
          token="$("$RUNNER_TEMP/atlas-cli" tokengen)"
          echo "::add-mask::$token"
          echo "ATLAS_TEST_TOKEN=$token" >> "$GITHUB_ENV"
          ATLAS_GOSSIP_KEY="$("$RUNNER_TEMP/atlas-cli" keygen)" ATLAS_API_TOKENS="$token"             ATLAS_NODE_ID=ci-node ATLAS_DB_PATH="$RUNNER_TEMP/atlas.db" ATLAS_HTTP_ADDR=127.0.0.1:8080             ATLAS_GRPC_ADDR=127.0.0.1:8082 ATLAS_METRICS_ADDR=127.0.0.1:9090 ATLAS_GOSSIP_BIND_ADDR=127.0.0.1:7946             ATLAS_RATE_LIMIT_RPS=500 ATLAS_RATE_LIMIT_BURST=1000             nohup "$RUNNER_TEMP/atlas-node" > "$RUNNER_TEMP/node.log" 2>&1 &
          deadline=$((SECONDS + 60))
          until curl -fsS http://127.0.0.1:8080/readyz >/dev/null; do
            if (( SECONDS >= deadline )); then cat "$RUNNER_TEMP/node.log"; exit 1; fi
            sleep 1
          done
      - name: Run Python client tests
        working-directory: clients/python
        env:
          ATLAS_TEST_ENDPOINT: http://127.0.0.1:8080
        run: python3 -m unittest discover -s tests -v
      - name: Node log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/node.log"

  scale:
    name: Membership scale simulation
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: Simulate 100, 500, and 1000 node convergence
        run: go test -run '^$' -bench '^BenchmarkClusterConvergence$' -benchtime=1x -timeout=15m ./internal/membership | tee scale-benchmark.txt
      - uses: actions/upload-artifact@v7
        with: { name: membership-scale-benchmark, path: scale-benchmark.txt }

  vulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  manifests:
    name: Validate deploy manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Render kustomize overlays
        run: |
          for o in dev production; do
            cp deploy/k8s/overlays/$o/secrets.env.example deploy/k8s/overlays/$o/secrets.env
            kubectl kustomize deploy/k8s/overlays/$o > /tmp/$o.yaml
          done
      - name: kubeconform
        run: |
          docker run --rm -v /tmp:/m ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -ignore-missing-schemas /m/dev.yaml /m/production.yaml
      - name: Compose config
        run: |
          cp .env.example .env
          ./scripts/gen-secrets.sh .env
          docker compose config --quiet

  chaos:
    name: Compose cluster and node failure recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Generate local test secrets
        run: |
          cp .env.example .env
          ./scripts/gen-secrets.sh .env
      - name: Start full Compose stack
        run: docker compose up -d --build
      - name: Verify APIs and monitoring become ready
        run: |
          deadline=$((SECONDS + 300))
          until curl -fsS http://127.0.0.1:8081/readyz >/dev/null \
            && curl -fsS http://127.0.0.1:8082/readyz >/dev/null \
            && curl -fsS http://127.0.0.1:8083/readyz >/dev/null \
            && curl -fsS http://127.0.0.1:9091/-/ready >/dev/null \
            && curl -fsS http://127.0.0.1:3000/api/health >/dev/null; do
            if (( SECONDS >= deadline )); then docker compose ps; docker compose logs --tail=100; exit 1; fi
            sleep 3
          done
      - name: Load test authenticated membership and registry APIs
        run: docker compose --profile loadtest run --rm k6
      - name: Kill and restart a cluster member
        run: ./scripts/chaos.sh 1
      - name: Collect stack state on failure
        if: failure()
        run: docker compose ps; docker compose logs --tail=200
      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  image:
    name: Build & scan image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: atlas:ci
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for CVEs (fail on high/critical)
        uses: anchore/scan-action@v7
        with:
          image: atlas:ci
          fail-build: true
          severity-cutoff: high
          output-format: table
