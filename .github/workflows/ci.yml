name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs opt in to more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@v9
        # Must be built with a Go release >= the go directive in go.mod.
        with: { version: v2.15.0 }

  test:
    name: Test (race + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go mod verify
      - run: go test -race -shuffle=on -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Enforce 60% statement coverage
        # Generated protobuf code is excluded; it is tested through the API.
        run: |
          grep -v '\.pb\.go:' coverage.out > coverage.handwritten.out
          total=$(go tool cover -func=coverage.handwritten.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          awk -v total="$total" 'BEGIN { if (total < 60) exit 1 }'
          echo "Total statement coverage: ${total}% (minimum 60%)"
      - uses: actions/upload-artifact@v7
        with: { name: coverage, path: coverage.out }

  python-client:
    name: Python client against a live node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: Start a single development node
        run: ./scripts/start-test-node.sh
      - name: Run Python client tests
        working-directory: clients/python
        run: python3 -m unittest discover -s tests -v
      - name: Node log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/node.log"

  service-examples:
    name: Go and Python service examples against a live node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: Start a single development node
        run: ./scripts/start-test-node.sh
      - name: Run, call, re-register and shut down both examples
        run: bash examples/test.sh
      - name: Node log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/node.log"

  node-client:
    name: Node.js client against a live node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: Start a single development node
        run: ./scripts/start-test-node.sh
      - name: Build and test the TypeScript client
        working-directory: clients/node
        run: |
          node --version
          npm ci --no-audit --no-fund
          npm run build
          npm test
      - name: Node log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/node.log"

  console:
    name: Atlas Console (typecheck, tests, build, live e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: Start a single development node
        run: ./scripts/start-test-node.sh
      - name: Install, typecheck, test and build
        working-directory: atlas-console
        env:
          ATLAS_LIVE_URL: ${{ env.ATLAS_TEST_ENDPOINT }}
          ATLAS_LIVE_TOKEN: ${{ env.ATLAS_TEST_TOKEN }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          node --version
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Node log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/node.log"

  terraform-provider:
    name: Terraform provider against a live node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@v7
        with: { go-version-file: terraform-provider-atlas/go.mod }
      - name: Install Terraform
        run: |
          if ! command -v terraform >/dev/null; then
            curl -fsSL -o /tmp/tf.zip https://releases.hashicorp.com/terraform/1.13.4/terraform_1.13.4_linux_amd64.zip
            sudo unzip -o -q /tmp/tf.zip -d /usr/local/bin
          fi
          terraform version
      - name: Start a single development node
        run: ./scripts/start-test-node.sh
      - name: Build, vet and run acceptance tests
        working-directory: terraform-provider-atlas
        env:
          TF_ACC: "1"
          ATLAS_ADDR: ${{ env.ATLAS_TEST_ENDPOINT }}
          ATLAS_TOKEN: ${{ env.ATLAS_TEST_TOKEN }}
        run: |
          go build ./...
          go vet ./...
          go test -count=1 ./...
          terraform fmt -check -recursive examples
      - name: Node log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/node.log"

  kubernetes:
    name: Helm chart and Kubernetes controller in kind
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Tools
        run: |
          command -v kind >/dev/null || { curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64 && sudo install /tmp/kind /usr/local/bin/kind; }
          command -v helm >/dev/null || curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          kind version && helm version --short && kubectl version --client
      - name: Lint the chart
        run: |
          helm lint deploy/helm/atlas --strict
          helm lint deploy/helm/atlas --strict --set k8sSync.enabled=true --set networkPolicy.enabled=true             --set tls.enabled=true --set tls.secretName=atlas-tls --set "k8sSync.namespaces={a,b}"
          helm template ci deploy/helm/atlas --set k8sSync.enabled=true --set networkPolicy.enabled=true > /tmp/chart.yaml
          helm lint deploy/helm/atlas --strict --set autoscaling.enabled=true --set backup.enabled=true --set backup.bucket=atlas-ci --set backup.existingSecret=atlas-backup-ci
          helm template ci deploy/helm/atlas --set autoscaling.enabled=true --set backup.enabled=true --set backup.bucket=atlas-ci --set backup.existingSecret=atlas-backup-ci > /tmp/chart-ops.yaml
          docker run --rm -v /tmp:/m ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary -ignore-missing-schemas /m/chart.yaml /m/chart-ops.yaml
      - name: Create a cluster and load the image
        run: |
          kind create cluster --name atlas --wait 120s
          docker build -t atlas:ci --build-arg VERSION=ci --build-arg COMMIT=${{ github.sha }} .
          kind load docker-image atlas:ci --name atlas
      - name: Install Atlas with the controller
        run: |
          helm install atlas deploy/helm/atlas -n atlas --create-namespace             --set image.repository=atlas --set image.tag=ci --set image.pullPolicy=Never             --set k8sSync.enabled=true --set k8sSync.cluster=ci --wait --timeout 5m
          helm test atlas -n atlas --logs
      - name: Annotated pods appear, follow scaling and leave
        run: |
          kubectl apply -f deploy/k8s/examples/annotated-service.yaml
          kubectl -n demo rollout status deploy/whoami --timeout=180s
          TOKEN=$(kubectl -n atlas get secret atlas-secrets -o jsonpath='{.data.ATLAS_ADMIN_TOKEN}' | base64 -d)
          echo "::add-mask::$TOKEN"
          kubectl -n atlas port-forward svc/atlas 8080:8080 >/tmp/pf.log 2>&1 &
          healthy() {
            curl -fsS -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:8080/v1/services?tag=atlas-k8s:ci&health=healthy" | jq '.services | length'
          }
          expect() {
            local want=$1 deadline=$((SECONDS + 120))
            until [ "$(healthy 2>/dev/null)" = "$want" ]; do
              if (( SECONDS >= deadline )); then
                echo "wanted $want healthy instances"; curl -s -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:8080/v1/services?tag=atlas-k8s:ci" | jq .
                kubectl -n atlas logs deploy/atlas-k8s --tail=100; exit 1
              fi
              sleep 2
            done
            echo "healthy instances: $want"
          }
          expect 2
          kubectl -n demo scale deploy/whoami --replicas=1
          expect 1
          kubectl -n demo annotate service whoami atlas.io/register-
          expect 0
          curl -fsS -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:8080/v1/topology?scope=cluster" | jq -e '[.nodes[] | select(.view)] | length == 3'
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n atlas logs statefulset/atlas --tail=100 || true
          kubectl -n atlas logs deploy/atlas-k8s --tail=100 || true

  java-client:
    name: Java client against a live node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: Start a single development node
        run: ./scripts/start-test-node.sh
      - name: Build and test the Java client
        working-directory: clients/java
        run: |
          java -version
          mvn -B -ntp test
      - name: Node log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/node.log"

  scale:
    name: Membership scale simulation
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: Simulate 100, 500, and 1000 node convergence
        run: go test -run '^$' -bench '^BenchmarkClusterConvergence$' -benchtime=1x -timeout=15m ./internal/membership | tee scale-benchmark.txt
      - uses: actions/upload-artifact@v7
        with: { name: membership-scale-benchmark, path: scale-benchmark.txt }

  vulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  manifests:
    name: Validate deploy manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Render kustomize overlays
        run: |
          for o in dev production; do
            cp deploy/k8s/overlays/$o/secrets.env.example deploy/k8s/overlays/$o/secrets.env
            kubectl kustomize deploy/k8s/overlays/$o > /tmp/$o.yaml
          done
      - name: kubeconform
        run: |
          docker run --rm -v /tmp:/m ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -ignore-missing-schemas /m/dev.yaml /m/production.yaml
      - name: Compose config
        run: |
          cp .env.example .env
          ./scripts/gen-secrets.sh .env
          docker compose config --quiet

  chaos:
    name: Compose cluster and node failure recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Generate local test secrets
        run: |
          cp .env.example .env
          ./scripts/gen-secrets.sh .env
      - name: Start full Compose stack
        run: docker compose up -d --build
      - name: Verify APIs and monitoring become ready
        run: |
          deadline=$((SECONDS + 300))
          until curl -fsS http://127.0.0.1:8081/readyz >/dev/null \
            && curl -fsS http://127.0.0.1:8082/readyz >/dev/null \
            && curl -fsS http://127.0.0.1:8083/readyz >/dev/null \
            && curl -fsS http://127.0.0.1:9091/-/ready >/dev/null \
            && curl -fsS http://127.0.0.1:3000/api/health >/dev/null; do
            if (( SECONDS >= deadline )); then docker compose ps; docker compose logs --tail=100; exit 1; fi
            sleep 3
          done
      - name: Load test authenticated membership and registry APIs
        run: docker compose --profile loadtest run --rm k6
      - name: Kill and restart a cluster member
        timeout-minutes: 14
        run: ./scripts/chaos.sh 1
      - name: Collect stack state on failure
        if: failure()
        run: docker compose ps; docker compose logs --tail=200
      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  image:
    name: Build & scan image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: atlas:ci
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for CVEs (fail on high/critical)
        uses: anchore/scan-action@v7
        with:
          image: atlas:ci
          fail-build: true
          severity-cutoff: high
          output-format: table
