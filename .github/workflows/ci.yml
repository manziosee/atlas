name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs opt in to more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@v9
        # Must be built with a Go release >= the go directive in go.mod.
        with: { version: v2.15.0 }

  test:
    name: Test (race + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go mod verify
      - run: go test -race -shuffle=on -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v7
        with: { name: coverage, path: coverage.out }

  vulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  manifests:
    name: Validate deploy manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Render kustomize overlays
        run: |
          for o in dev production; do
            cp deploy/k8s/overlays/$o/secrets.env.example deploy/k8s/overlays/$o/secrets.env
            kubectl kustomize deploy/k8s/overlays/$o > /tmp/$o.yaml
          done
      - name: kubeconform
        run: |
          docker run --rm -v /tmp:/m ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -ignore-missing-schemas /m/dev.yaml /m/production.yaml
      - name: Compose config
        run: |
          cp .env.example .env
          ./scripts/gen-secrets.sh .env
          docker compose config --quiet

  image:
    name: Build & scan image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: atlas:ci
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for CVEs (fail on high/critical)
        uses: anchore/scan-action@v7
        with:
          image: atlas:ci
          fail-build: true
          severity-cutoff: high
          output-format: table
