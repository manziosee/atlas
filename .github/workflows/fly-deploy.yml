name: Promote Fly production

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: fly-staging-and-production
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    name: Stage, smoke test, and promote
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require successful CI for this revision
        run: gh run list --workflow CI --commit "$GITHUB_SHA" --status success --json databaseId --jq 'length > 0' | grep -qx true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy this commit to staging
        run: flyctl deploy --remote-only --config deploy/fly/staging.toml --build-arg VERSION="${HEAD_SHA::12}" --build-arg COMMIT="$HEAD_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_API_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
      - name: Smoke test staging
        run: |
          for path in /healthz /readyz; do
            curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 3 "https://atlas-staging.fly.dev$path" >/dev/null
          done
      - name: Promote the same commit to production
        run: flyctl deploy --remote-only --config fly.toml --build-arg VERSION="${HEAD_SHA::12}" --build-arg COMMIT="$HEAD_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
