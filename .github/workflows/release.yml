# On a version tag: build a multi-arch image, push it to GHCR, generate an
# SBOM and build provenance, and sign the image keylessly with Sigstore.
# Every push to main publishes the same way as :edge, so
# `docker run ghcr.io/manziosee/atlas:edge` always has the latest main.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless cosign signing
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('edge-{0}', github.sha) }}
            COMMIT=${{ github.sha }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless, Sigstore)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The Helm chart as an OCI artifact: oci://ghcr.io/<owner>/charts/atlas.
  # main publishes the version in Chart.yaml with the :edge image; a tag
  # vX.Y.Z publishes chart X.Y.Z pinned to image X.Y.Z.
  chart:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Package and push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          command -v helm >/dev/null || curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          args=()
          if [ "$REF_TYPE" = tag ]; then
            args=(--version "${REF_NAME#v}" --app-version "${REF_NAME#v}")
          fi
          helm lint deploy/helm/atlas --strict
          helm package deploy/helm/atlas "${args[@]}" -d /tmp/chart
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push /tmp/chart/atlas-*.tgz "oci://ghcr.io/${OWNER,,}/charts"

  # Release binaries for every command, on a version tag only: static,
  # CGO-free archives for Linux, macOS and Windows, with SHA-256 checksums.
  binaries:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          date="$(git log -1 --format=%cI)"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="atlas_${VERSION#v}_${os}_${arch}"
            out="build/$name"
            mkdir -p "$out"
            ext=""; [ "$os" = windows ] && ext=".exe"
            for cmd in atlas-node atlas-cli atlas-agent atlas-k8s; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false \
                -ldflags="-s -w -X github.com/manziosee/atlas/internal/version.Version=${VERSION} -X github.com/manziosee/atlas/internal/version.Commit=${COMMIT} -X github.com/manziosee/atlas/internal/version.Date=${date}" \
                -o "$out/$cmd$ext" "./cmd/$cmd"
            done
            cp LICENSE README.md "$out/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  # The GitHub Release: notes from this version's CHANGELOG.md section, the
  # binaries, and build provenance attestations for each archive.
  github-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [image, binaries]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: binaries, path: dist }
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz, dist/*.zip
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat >> notes.md <<NOTES

          ## Install

          \`\`\`bash
          docker run --rm -p 8080:8080 ghcr.io/${GITHUB_REPOSITORY}:${version}
          \`\`\`

          Binaries for Linux, macOS and Windows are attached below; verify them with \`checksums.txt\` or \`gh attestation verify <file> -R ${GITHUB_REPOSITORY}\`.
          NOTES
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --title "Atlas $TAG" --notes-file notes.md --verify-tag $prerelease
