version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go-deps: { patterns: ["*"] }
  - package-ecosystem: gomod
    directory: /terraform-provider-atlas
    schedule: { interval: weekly }
    groups:
      terraform-provider: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /clients/node
    schedule: { interval: weekly }
    groups:
      node-client: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /atlas-console
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups:
      atlas-console: { patterns: ["*"] }
  - package-ecosystem: maven
    directory: /clients/java
    schedule: { interval: weekly }
    groups:
      java-client: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /clients/python
    schedule: { interval: weekly }
