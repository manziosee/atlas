openapi: 3.1.0
info:
  title: Atlas Node API
  version: 1.3.0
  description: >-
    Authenticated HTTP API for cluster membership and the replicated service
    registry. Every node serves the same API, and any node accepts any
    request. A service is owned by the node that registered it; a write that
    reaches another node is forwarded to the owner (using the owner's
    gossiped API address and the caller's own credential) and the owner's
    answer is returned. Without a reachable owner the response is
    409 not_owner or 502 owner_unreachable.


    Every error response uses the Error schema. Branch on `code`, which is
    stable; `error` is a human-readable message.
servers:
  - url: https://atlas-edge.fly.dev
    description: Public demo cluster
  - url: http://127.0.0.1:8080
    description: Local node
security:
  - bearerAuth: []
tags:
  - name: health
  - name: cluster
  - name: registry
  - name: events
  - name: admin
  - name: telemetry
paths:
  /healthz:
    get:
      tags: [health]
      security: []
      summary: Check process liveness
      responses:
        '200': { description: The node is running. }
  /readyz:
    get:
      tags: [health]
      security: []
      summary: Check node readiness
      responses:
        '200': { description: The node is ready. }
        '503': { description: The node is not ready. }
  /v1/node:
    get:
      tags: [cluster]
      summary: Get this node's identity and version
      responses:
        '200':
          description: Node details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  node: { $ref: '#/components/schemas/Member' }
                  version: { type: string }
                  commit: { type: string }
        '401': { $ref: '#/components/responses/Error' }
  /v1/members:
    get:
      tags: [cluster]
      summary: List members known to this node
      responses:
        '200':
          description: Current local membership view.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  members: { type: array, items: { $ref: '#/components/schemas/Member' } }
        '401': { $ref: '#/components/responses/Error' }
  /v1/topology:
    get:
      tags: [cluster]
      summary: Measured latency between nodes
      description: >-
        This node's smoothed probe round-trip time to each peer, and its
        location when ATLAS_LOCATION is set. With scope=cluster the node also
        asks every live peer for its own view, using the caller's credential,
        and returns them all; peers that cannot be read carry an `error`.
      parameters:
        - { in: query, name: scope, schema: { type: string, enum: [node, cluster], default: node } }
      responses:
        '200':
          description: >-
            scope=node returns a NodeTopology. scope=cluster returns
            `{nodes: [{id, view?: NodeTopology, error?}], truncated, at}`.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/NodeTopology' }
                  - type: object
                    properties:
                      nodes:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            view: { $ref: '#/components/schemas/NodeTopology' }
                            error: { type: string }
                      truncated: { type: boolean, description: More than 128 peers; the rest were not queried }
                      at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }
  /v1/services:
    get:
      tags: [registry]
      summary: List registered service instances, one page at a time
      description: >-
        Results are ordered by name, region, node and ID. Follow `next_cursor`
        until it is absent to read every match.
      parameters:
        - { in: query, name: name, schema: { type: string, maxLength: 128 } }
        - { in: query, name: region, schema: { type: string, maxLength: 128 } }
        - { in: query, name: health, schema: { $ref: '#/components/schemas/Health' } }
        - { in: query, name: version, schema: { type: string, maxLength: 128 } }
        - { in: query, name: node_id, description: Owning node, schema: { type: string, maxLength: 128 } }
        - in: query
          name: tag
          description: Required tag. Repeat for several; a service must carry all of them.
          style: form
          explode: true
          schema: { type: array, maxItems: 16, items: { type: string } }
        - in: query
          name: meta
          description: >-
            Required metadata entry as key:value, for example team:payments. Repeat
            for several (at most 8, one per key); a service must carry all of them
            with exactly those values.
          style: form
          explode: true
          schema: { type: array, maxItems: 8, items: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._/-]{0,62}:' } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { in: query, name: cursor, description: next_cursor from the previous page, schema: { type: string } }
      responses:
        '200':
          description: One page of matching active instances.
          content:
            application/json:
              schema:
                type: object
                required: [count, services]
                properties:
                  count: { type: integer, description: Instances in this page }
                  services: { type: array, items: { $ref: '#/components/schemas/Service' } }
                  next_cursor: { type: string, description: Present when more pages exist }
        '400': { $ref: '#/components/responses/Error' }
    post:
      tags: [registry]
      summary: Register a service instance on this node
      description: >-
        Registration is idempotent when the request carries an `id` or an
        `Idempotency-Key` header: repeating it returns the existing record
        (200) instead of creating a duplicate, and changed content updates it.
        If the ID belongs to a node that has left the cluster, this node adopts it.
      parameters:
        - in: header
          name: Idempotency-Key
          description: Derives a stable ID per credential. Do not combine with a different `id`.
          schema: { type: string, maxLength: 256 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceSpec' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '200': { $ref: '#/components/responses/Service' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/services/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [registry]
      summary: Get a service instance
      responses:
        '200': { $ref: '#/components/responses/Service' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [registry]
      summary: Create or fully replace a service with this ID
      description: Without If-Match this is an idempotent create-or-replace. With If-Match the service must exist at that revision.
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceSpec' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '200': { $ref: '#/components/responses/Service' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
    patch:
      tags: [registry]
      summary: Change some fields of a service (forwarded to its owner)
      description: Changing address, health_check or ttl_seconds resets health to unknown; other edits keep it.
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicePatch' }
      responses:
        '200': { $ref: '#/components/responses/Service' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
    delete:
      tags: [registry]
      summary: Deregister a service
      description: >-
        The owning node always accepts this. Any other node accepts it when the
        owner has left the cluster, or when the credential has the admin scope;
        otherwise the response is 409 owner_alive with `owner_node`.
      responses:
        '204': { description: Service deleted. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /v1/services/{id}/heartbeat:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [registry]
      summary: Refresh a TTL service and mark it healthy
      description: >-
        Send heartbeats more often than ttl_seconds, for example every third of it.
        One missed TTL period marks the service unhealthy; three remove it, after
        which this returns 404 and the client should register again.
      responses:
        '200': { $ref: '#/components/responses/Service' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /v1/lookup/{name}:
    get:
      tags: [registry]
      summary: Select one healthy service instance
      description: >-
        Order of rules: never draining or unhealthy instances; the stale-record
        policy; healthy before unknown health; the requested region; the
        latency policy; then weighted rendezvous hashing on `key`, or weighted round-robin.
        `stale`, `latency` and `tolerance` override the node's
        ATLAS_ROUTING_* defaults for this request only.
      parameters:
        - { in: path, name: name, required: true, schema: { type: string } }
        - { in: query, name: region, schema: { type: string, maxLength: 64 } }
        - { in: query, name: key, description: Stable consistent-hash key, schema: { type: string, maxLength: 256 } }
        - { in: query, name: tag, style: form, explode: true, schema: { type: array, items: { type: string } } }
        - in: query
          name: meta
          description: >-
            Required metadata entry as key:value, for example team:payments. Repeat
            for several (at most 8, one per key); a service must carry all of them
            with exactly those values.
          style: form
          explode: true
          schema: { type: array, maxItems: 8, items: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._/-]{0,62}:' } }
        - in: query
          name: stale
          description: >-
            Instances whose owning node is not alive: include them like any other,
            prefer-live (use them only when no live-owner instance exists), or exclude them.
          schema: { type: string, enum: [include, prefer-live, exclude] }
        - { in: query, name: latency, description: Rank by measured node latency (nearest) or ignore it (off), schema: { type: string, enum: [nearest, off] } }
        - { in: query, name: tolerance, description: 'With latency=nearest, nodes within this duration of the nearest count as equal, for example 10ms. Defaults to the node setting (5ms unless configured); 0s means strictly the nearest.', schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Service' }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/services/{id}/history:
    get:
      tags: [registry]
      summary: Recorded changes to one service, newest first
      description: >-
        This node's record of every committed change to the service, its own and
        those learned from peers, kept after deregistration. Up to 100 entries per
        service, for ATLAS_HISTORY_RETENTION (7 days by default). A replica that
        merged several revisions at once records only the latest.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/HistoryLimit' }
        - { $ref: '#/components/parameters/HistoryBefore' }
      responses:
        '200': { $ref: '#/components/responses/History' }
        '400': { $ref: '#/components/responses/Error' }
  /v1/history:
    get:
      tags: [registry]
      summary: Recent changes across services, newest first
      parameters:
        - { in: query, name: name, description: Only services with this name, schema: { type: string, maxLength: 128 } }
        - { $ref: '#/components/parameters/HistoryLimit' }
        - { $ref: '#/components/parameters/HistoryBefore' }
      responses:
        '200': { $ref: '#/components/responses/History' }
        '400': { $ref: '#/components/responses/Error' }
  /v1/events:
    get:
      tags: [events]
      summary: Stream membership and registry events
      description: >-
        Server-Sent Events. Each event has an `id:` line; reconnect with the
        Last-Event-ID header (or `last_event_id` query parameter) to receive
        what was missed. An `event: reset` frame means the gap could not be
        replayed and the client should re-read current state. Event types:
        join, update, reap, service.registered, service.updated,
        service.health, service.deregistered.
      parameters:
        - { in: query, name: kinds, description: 'Comma-separated: member, service', schema: { type: string } }
        - { in: query, name: service, description: Only service events for this name, schema: { type: string } }
        - { in: query, name: last_event_id, schema: { type: string } }
        - { in: header, name: Last-Event-ID, schema: { type: string } }
      responses:
        '200':
          description: Event stream. The data line of each frame is an Event.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/Error' }
  /v1/admin/credentials:
    get:
      tags: [admin]
      summary: List configured and runtime-managed API credentials without secrets
      responses:
        '200':
          description: Credentials by fingerprint. `id` matches token_id in access logs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  credentials:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        scopes: { type: array, items: { type: string, enum: [read, write, admin] } }
                        created_at: { type: string, format: date-time }
                        expires_at: { type: string, format: date-time }
                        source: { type: string, enum: [static, scoped, managed] }
                        expired: { type: boolean }
                        revoked: { type: boolean }
                        current: { type: boolean, description: True for the credential making this request }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      summary: Create a runtime-managed API credential
      description: >-
        Creates a cluster-wide credential. The bearer token is returned once;
        only its SHA-256 digest is stored and replicated over authenticated
        gossip. All cluster nodes must run a version that supports managed
        credentials. Peer replication is asynchronous. Expiry must be within
        one year.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes, expires_at]
              properties:
                name: { type: string, minLength: 1, maxLength: 128 }
                scopes: { type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: { type: string, enum: [read, write, admin] } }
                expires_at: { type: string, format: date-time }
      responses:
        '201':
          description: Created. The token is returned only in this response.
          headers:
            Cache-Control: { schema: { type: string }, example: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [credential, token]
                properties:
                  credential: { type: object }
                  token: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/admin/credentials/{id}:
    delete:
      tags: [admin]
      summary: Revoke a runtime-managed API credential
      description: Revocation is permanent and converges to cluster peers through authenticated anti-entropy. A credential cannot revoke itself.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '204': { description: Revoked. }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/admin/audit:
    get:
      tags: [admin]
      summary: Read this node's admin audit log
      description: Credential changes, backups, and node evictions are recorded locally and retained for 90 days. Secrets are never included.
      parameters:
        - { in: query, name: before, schema: { type: integer, minimum: 1 }, description: Return entries with a lower sequence number }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Most recent admin audit entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  next_before: { type: integer }
                  entries:
                    type: array
                    items: { type: object }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/telemetry/event:
    post:
      tags: [telemetry]
      x-internal: true
      security: []
      summary: Record an anonymous usage event from a hosted console
      description: >-
        Off unless the node sets ATLAS_ANALYTICS_ENABLED=true. With
        ATLAS_TELEMETRY_KEY set, requests must carry it in
        X-Atlas-Telemetry-Key, and only then is `country` stored. The node
        stores a hash of the UTC day and visitor_id, never the ID itself;
        paths keep only their first segment. Aggregates are capped per day
        and kept for 90 days. Rate-limited like every other route.
      parameters:
        - { in: header, name: X-Atlas-Telemetry-Key, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitor_id]
              properties:
                type: { type: string, enum: [pageview, connect], default: pageview }
                visitor_id: { type: string, format: uuid, description: Random per-browser ID }
                path: { type: string, description: 'For pageview: the page path' }
                kind: { type: string, enum: [node, demo], description: 'For connect: own node or the demo' }
                version: { type: string, maxLength: 32, description: "For connect: the node's version" }
                country: { type: string, pattern: '^[A-Z]{2}$', description: ISO 3166-1 alpha-2; ignored without a valid telemetry key }
      responses:
        '204': { description: Recorded. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { description: Telemetry is disabled on this node. }
        '415': { $ref: '#/components/responses/Error' }
  /v1/admin/analytics:
    get:
      tags: [admin]
      x-internal: true
      summary: Usage totals across the cluster
      description: >-
        Daily page views, unique visitors and systems (browsers that connected
        a console to their own node), pages, countries, node versions and API
        request counters since each node started. The node asks every live
        peer with the caller's credential and merges visitor counts with
        sketches, so a browser seen by several nodes counts once; a single
        node reports exact counts.
      parameters:
        - { in: query, name: days, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }
      responses:
        '200':
          description: Cluster usage report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageReport' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/admin/backup:
    post:
      tags: [admin]
      summary: Download a consistent SQLite snapshot of this node's registry
      responses:
        '200':
          description: SQLite database file. Restore it with `atlas-cli db-restore`.
          content:
            application/vnd.sqlite3:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Error' }
  /v1/admin/nodes/{id}:
    delete:
      tags: [admin]
      summary: Evict a failed node and delete its services
      description: Only nodes that are not alive can be evicted; a live node would rejoin immediately.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Node evicted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  node_id: { type: string }
                  services_removed: { type: integer }
                  member: { $ref: '#/components/schemas/Member' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Reads need the read scope, registry changes the write scope, and
        /v1/admin routes the admin scope. Admin credentials hold every scope.
        Missing or expired credentials receive 401 unauthorized; credentials
        without the required scope receive 403 insufficient_scope.
  parameters:
    HistoryLimit: { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
    HistoryBefore: { in: query, name: before, description: next_before from the previous page, schema: { type: integer, minimum: 1 } }
    IfMatch:
      in: header
      name: If-Match
      description: The ETag (revision) the change is based on, for example "3".
      schema: { type: string }
  responses:
    History:
      description: One page of history entries, newest first.
      content:
        application/json:
          schema:
            type: object
            required: [count, entries]
            properties:
              count: { type: integer }
              entries: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } }
              next_before: { type: integer, description: Present when older entries exist }
    Service:
      description: The service instance. The ETag header carries its revision.
      headers:
        ETag: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Service' }
    Created:
      description: The created service instance.
      headers:
        ETag: { schema: { type: string } }
        Location: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Service' }
    Error:
      description: An error. See Error.code.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Health:
      type: string
      enum: [unknown, healthy, unhealthy]
    ServiceSpec:
      type: object
      required: [name, address]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$', description: Optional stable ID; random when omitted }
        name: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$' }
        address: { type: string, description: 'Host and port, for example 10.0.0.8:8080' }
        version: { type: string, maxLength: 128 }
        tags: { type: array, maxItems: 16, items: { type: string, maxLength: 64 } }
        health_check:
          type: string
          format: uri
          description: >-
            Check on the service address, chosen by scheme: http:// or https:// (2xx passes),
            tcp:// (a connection passes) or grpc:// / grpcs:// (grpc.health.v1 SERVING passes;
            an optional path names the gRPC service). Not with ttl_seconds.
          examples: ['http://10.0.0.8:8080/healthz', 'tcp://10.0.0.8:5432', 'grpc://10.0.0.8:9000/payments.v1.API']
        ttl_seconds: { type: integer, minimum: 1, maximum: 86400, description: Heartbeat TTL. Not with health_check. }
        check_interval_seconds: { type: integer, minimum: 1, maximum: 3600, description: Check interval for this service; ATLAS_HEALTH_CHECK_INTERVAL when omitted. Needs health_check. }
        unhealthy_threshold: { type: integer, minimum: 1, maximum: 10, description: Consecutive failed checks before a healthy service turns unhealthy (default 3). Needs health_check. }
        healthy_threshold: { type: integer, minimum: 1, maximum: 10, description: Consecutive passing checks before an unhealthy service recovers (default 2). Needs health_check. }
        draining: { type: boolean, description: 'Keep the record but send it no traffic: lookups, DNS and client load balancers skip it.' }
        traffic_weight: { type: integer, minimum: 1, maximum: 1000, default: 1, description: 'Relative traffic share after health, stale, region and latency filtering.' }
        metadata: { $ref: '#/components/schemas/Metadata' }
    Metadata:
      type: object
      description: >-
        Key/value labels such as team, protocol or git commit; filter on them with
        meta=key:value. At most 16 entries whose keys and values total 512 bytes.
      maxProperties: 16
      propertyNames: { pattern: '^[a-zA-Z0-9][a-zA-Z0-9._/-]{0,62}$' }
      additionalProperties: { type: string, maxLength: 256 }
      examples: [{ team: payments, protocol: grpc, git.commit: 3f9c2e1 }]
    ServicePatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        address: { type: string }
        version: { type: string }
        tags: { type: array, items: { type: string } }
        health_check: { type: string }
        ttl_seconds: { type: integer }
        check_interval_seconds: { type: integer }
        unhealthy_threshold: { type: integer }
        healthy_threshold: { type: integer }
        draining: { type: boolean }
        traffic_weight: { type: integer, minimum: 1, maximum: 1000 }
        metadata:
          allOf: [{ $ref: '#/components/schemas/Metadata' }]
          description: Replaces the whole map, like tags; {} removes every entry.
    Service:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        node_id: { type: string, description: Owning node }
        address: { type: string }
        region: { type: string }
        version: { type: string }
        tags: { type: array, items: { type: string } }
        health_check: { type: string }
        health: { $ref: '#/components/schemas/Health' }
        revision: { type: integer, description: Increases on every change; use with If-Match }
        ttl_seconds: { type: integer }
        check_interval_seconds: { type: integer }
        unhealthy_threshold: { type: integer }
        healthy_threshold: { type: integer }
        draining: { type: boolean }
        traffic_weight: { type: integer, minimum: 1, maximum: 1000 }
        metadata: { $ref: '#/components/schemas/Metadata' }
        updated_at: { type: string, format: date-time }
        checked_at: { type: string, format: date-time, description: Last health check (owner node only) }
        heartbeat_at: { type: string, format: date-time, description: Last heartbeat (owner node only) }
    HistoryEntry:
      type: object
      properties:
        seq: { type: integer, description: Orders entries on the answering node only }
        service_id: { type: string }
        name: { type: string }
        revision: { type: integer }
        change: { type: string, enum: [registered, updated, health, deregistered] }
        at: { type: string, format: date-time }
        service: { $ref: '#/components/schemas/Service' }
    Member:
      type: object
      properties:
        id: { type: string }
        addr: { type: string }
        region: { type: string }
        state: { type: string, enum: [alive, suspect, dead, left] }
        incarnation: { type: integer }
        since: { type: string, format: date-time }
        api_addr: { type: string, description: Base URL of the member's HTTP API; used to forward writes to the owner }
    NodeTopology:
      type: object
      properties:
        node: { $ref: '#/components/schemas/Member' }
        location:
          type: object
          properties:
            lat: { type: number }
            lon: { type: number }
        version: { type: string }
        at: { type: string, format: date-time }
        peers:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              region: { type: string }
              state: { type: string, enum: [alive, suspect, dead, left] }
              rtt_ms: { type: number, description: Smoothed probe round-trip time; absent until measured }
    Event:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        kind: { type: string, enum: [member, service] }
        at: { type: string, format: date-time }
        member: { $ref: '#/components/schemas/Member' }
        service: { $ref: '#/components/schemas/Service' }
    UsageReport:
      type: object
      properties:
        days: { type: integer }
        node_id: { type: string }
        nodes_included: { type: integer, description: Nodes whose data is in the report }
        node_errors:
          type: array
          items: { type: object, properties: { node_id: { type: string }, error: { type: string } } }
        daily:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              page_views: { type: integer }
              unique_visitors: { type: integer }
              unique_visitors_capped: { type: boolean, description: The daily visitor cap was reached on some node }
              systems: { type: integer, description: Browsers that connected a console to their own node }
              node_connections: { type: integer }
              demo_connections: { type: integer }
        pages:
          type: array
          items: { type: object, properties: { page: { type: string }, page_views: { type: integer } } }
        countries:
          type: array
          items:
            type: object
            properties:
              country: { type: string }
              page_views: { type: integer }
              visitors: { type: integer, description: Browser-days }
        system_countries:
          type: array
          description: Where systems using Atlas are, as system-days
          items: { type: object, properties: { country: { type: string }, systems: { type: integer } } }
        versions:
          type: array
          items: { type: object, properties: { version: { type: string }, connections: { type: integer } } }
        api_requests_since_start: { type: integer }
        api_errors_since_start: { type: integer }
        api_requests_by_route:
          type: array
          items: { type: object, properties: { route: { type: string }, count: { type: integer }, errors: { type: integer } } }
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: Human-readable message }
        code:
          type: string
          description: Stable machine-readable code.
          enum:
            - invalid_json
            - validation_failed
            - unauthorized
            - insufficient_scope
            - not_found
            - route_not_found
            - method_not_allowed
            - not_owner
            - owner_alive
            - owner_unreachable
            - member_alive
            - precondition_failed
            - no_ttl
            - rate_limited
            - payload_too_large
            - no_healthy_instance
            - unavailable
            - internal
        request_id: { type: string, description: Matches request_id in the node's access log }
        owner_node: { type: string, description: 'For not_owner, owner_alive and owner_unreachable: the node that owns the service' }
